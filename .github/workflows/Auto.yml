name: Three Cycle Trading Session

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Number of cycles to run"
        default: "3"
        required: true
        type: string
      cycle_length:
        description: "Length of each cycle (minutes)"
        default: "5"
        required: true
        type: string

jobs:
  trading_session:
    runs-on: ubuntu-latest

    steps:
      - name: Session setup
        run: |
          echo "Preparing trading session"
          echo "Cycles: ${{ inputs.cycles }}"
          echo "Cycle length: ${{ inputs.cycle_length }} minutes"

      - name: Run trading bot
        run: |
          echo "Bot will run ${{ inputs.cycles }} cycles"
          echo "Each cycle lasts ${{ inputs.cycle_length }} minutes"
          echo "Bot starts now"

      - name: Session complete
        run: |
          echo "Trading session finished"
          echo "Review logs and reset for next session"
