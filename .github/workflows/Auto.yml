name: Run Trading Bot (1:00–2:20 PM CST)

on:
  schedule:
    # Run at 1:00 PM CST (19:00 UTC)
    - cron: "0 19 * * 1-5"
  workflow_dispatch:

jobs:
  run_bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install alpaca-py

      - name: Wait until 1:00 PM CST (19:00 UTC)
        run: |
          echo "Starting trading session at 1:00 PM CST (19:00 UTC)"

      - name: Run trading bot for 3 cycles (5 minutes each)
        run: |
          echo "Running bot for 3 cycles of 5 minutes..."
          python3 bot.py

      - name: Stop session at 2:20 PM CST (20:20 UTC)
        run: |
          echo "Trading session ended at 2:20 PM CST (20:20 UTC)"
          echo "Bot finished successfully."
